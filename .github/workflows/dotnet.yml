name: dotnet
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet restore KasWallet.sln
      - run: dotnet build KasWallet.sln --no-restore -c Release
      - run: dotnet test KasWallet.sln --no-build -c Release --verbosity normal
